services:
  - type: web
    name: jobnex-ai-backend
    runtime: python
    region: oregon
    plan: free
    branch: master
    rootDir: JobNexAI/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
